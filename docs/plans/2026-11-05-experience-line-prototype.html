<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Throwaway prototype: experience as a line map, one stop at a time, with living diagrams.
     Open from a repo checkout so the ../../ font paths resolve. -->
<title>Experience Line</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: 'Alte Haas Grotesk'; src: url('../../AlteHaasGroteskRegular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
@font-face { font-family: 'Alte Haas Grotesk'; src: url('../../AlteHaasGroteskBold.ttf') format('truetype'); font-weight: 700; font-display: swap; }
/* Layout: three columns on one blueprint sheet. Left, the line map (time runs
   down; the train rides to one stop at a time). Middle, that stop's living
   diagram in the uncrumpling frame. Right, the stop's card: company, role and
   numbered bullets, each one driving its state of the diagram. */
:root {
  --paper: #0041ba;
  --ink: #ffffff;
  --ink-soft: rgba(255, 255, 255, 0.78);
  --ink-mid: rgba(255, 255, 255, 0.5);
  --ink-faint: rgba(255, 255, 255, 0.22);
  --chrome: rgba(0, 38, 112, 0.92);
  --chrome-line: rgba(255, 255, 255, 0.28);
  --font: "Alte Haas Grotesk", "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
html { height: 100%; box-sizing: border-box; overflow: hidden; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; overflow: hidden;
  background: var(--paper); color: var(--ink); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
.stage { position: relative; width: 100%; height: 100%; overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

.nav { position: absolute; top: 22px; left: 10px; display: flex; align-items: center; gap: 12px; font-size: 16px; z-index: 6; }
.nav b { font-weight: 700; }
.nav i { width: 22px; height: 1px; background: var(--ink); display: block; }
.nav .ring { border: 1.5px solid var(--ink); border-radius: 999px; padding: 1px 8px; }
.tldr { position: absolute; top: 22px; right: 10px; font-size: 16px; z-index: 6; }

.hit {
  position: absolute; z-index: 3; background: transparent; border: 0; padding: 0; cursor: pointer; border-radius: 8px;
}
.hit:focus-visible { outline: 2px dashed var(--ink); outline-offset: 2px; }

/* Living frame */
.frame { position: absolute; z-index: 4; transform-origin: 50% 50%; visibility: hidden; }
.clip { position: absolute; inset: 0; background: var(--paper); }
.clip canvas { display: block; width: 100%; height: 100%; }
.creases { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.outline { position: absolute; pointer-events: none; }

/* Stop card */
.panel { position: absolute; z-index: 5; display: flex; flex-direction: column; justify-content: center; }
.card { transition: opacity 160ms ease, transform 160ms ease; }
.card.swap { opacity: 0; transform: translateY(6px); }
.stop { margin: 0 0 14px; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--ink-mid); }
.card h2 { margin: 0; font-size: clamp(28px, 2.8vw, 44px); line-height: 1; font-weight: 700; text-wrap: balance; }
.sub { margin: 10px 0 0; font-size: 13px; font-weight: 700; letter-spacing: 0.03em; color: var(--ink-soft); }
.bullets { list-style: none; margin: 30px 0 0; padding: 0; display: flex; flex-direction: column; gap: 16px; }
.bullets li { position: relative; padding-left: 32px; font-size: clamp(15px, 1.25vw, 19px); line-height: 1.45; outline: none; }
.bullets .n {
  position: absolute; left: 0; top: 0.18em; width: 19px; height: 19px; border-radius: 50%;
  display: grid; place-items: center; font-family: var(--mono); font-size: 11px; line-height: 1;
  border: 1px solid var(--ink-mid); color: var(--ink-soft); transition: background 200ms ease, color 200ms ease, border-color 200ms ease;
}
.bullets li.on .n { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.bullets .bar { display: block; height: 1.5px; width: 0; margin-top: 7px; background: var(--ink); opacity: 0.55; }
.bullets li.on .bar { animation: barfill var(--cycle, 5000ms) linear forwards; }
.bullets li.on.held .bar, .bullets li.on.still .bar { animation: none; width: 100%; }
@keyframes barfill { to { width: 100%; } }
.bullets li:focus-visible { outline: 2px dashed var(--ink); outline-offset: 4px; }
.hint {
  position: absolute; left: 0; bottom: 0; font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; color: var(--ink-mid);
  transition: opacity 400ms ease; pointer-events: none;
}

.controls {
  position: fixed; z-index: 10;
  left: calc(12px + env(safe-area-inset-left, 0px));
  bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: calc(100vw - 24px);
  background: var(--chrome); border: 1px solid var(--chrome-line); border-radius: 14px; padding: 8px 10px; font-size: 13px;
}
.c-label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); padding: 0 4px; }
.controls button { font: inherit; color: var(--ink-soft); background: transparent; border: 1px solid var(--chrome-line); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.controls button:hover { color: var(--ink); }
.controls button:focus-visible { outline: 2px dashed var(--ink); outline-offset: 3px; }
.narrow-note { display: none; flex-basis: 100%; color: var(--ink-soft); font-size: 12px; padding: 0 4px; }
@media (max-width: 760px) {
  .narrow-note { display: block; }
  .nav, .tldr { font-size: 13px; } .nav { gap: 8px; } .nav i { width: 12px; }
}
</style>

<div class="stage" id="stage">
  <canvas id="map" aria-hidden="true"></canvas>
  <div id="hits"></div>

  <div class="frame" id="frame">
    <canvas class="outline" id="outline" aria-hidden="true"></canvas>
    <div class="clip" id="clip" role="img">
      <canvas id="diagram" aria-hidden="true"></canvas>
      <svg class="creases" id="creases" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
  </div>

  <aside class="panel" id="panel" aria-label="experience">
    <div class="card" id="card" aria-live="polite">
      <p class="stop" id="stop"></p>
      <h2 id="sign-title"></h2>
      <p class="sub" id="sign-sub"></p>
      <ol class="bullets" id="bullets"></ol>
    </div>
    <div class="hint" id="hint">scroll for the next stop ↓</div>
  </aside>

  <nav class="nav" aria-label="Story navigation (static in this prototype)">
    <b>ryan kim</b><i></i><span>about</span><i></i><span>projects</span><i></i><span class="ring">experience</span>
  </nav>
  <div class="tldr">tldr</div>
</div>

<div class="controls" role="group" aria-label="Prototype controls">
  <span class="c-label">prototype</span>
  <button type="button" id="replay">replay arrival</button>
  <span class="narrow-note">built for desktop; on phones the site shows the tldr instead</span>
</div>

<script>
(() => {
  // ================= content =================
  // Months are counted from Jan 2025 = 0. Present is Nov 2026.
  const PRESENT = 22;
  const JOBS = [
    { key: 'paladin', company: 'paladin technologies', title: 'systems engineering intern', years: '2025',
      line: 'main', start: 4, end: 7,
      chunks: [
        'i automated an eight-hour geospatial workflow in python, bringing it down to under 30 seconds.',
        'the mapping format i designed was adopted across 250+ city of vancouver surveillance sites.',
      ] },
    { key: 'sailbot', company: 'ubc sailbot', title: 'website team lead', years: '2025 – now',
      line: 'branch', start: 9.5, end: PRESENT,
      chunks: [
        'i lead seven developers and designers, turning what the team needs into scoped projects.',
        'i spotted a gap in recruiting and prototyped a portal with shared applications and a review board for each team.',
        "i built a ship-tracking pipeline for about 200 vessels, so we didn't need a $25k/year external service.",
      ] },
    { key: 'shopify', company: 'shopify', title: 'software engineering intern', years: '2026',
      line: 'main', start: 16, end: 19,
      chunks: [
        "i shipped mobile experiences that turn a merchant's description of their business into an ai-generated storefront.",
        'i built custom skia animations for ios and android, refining motion, accessibility, and loading states with designers.',
        'i made the generation flow more reliable, fixing stale results, stuck progress, and an intermittent graphics crash.',
      ] },
    { key: 'superpilot', company: 'superpilot', title: 'software engineering intern', years: '2026 – now',
      line: 'main', start: 20, end: PRESENT,
      chunks: [
        'i prototyped an ai agent that researches a brand, builds its landing page, and reviews its own work on desktop and mobile.',
        'prompt optimization, caching, and model selection cut generation costs by 55% and roughly halved runtime.',
        "we evaluated it against the existing generator to shape the team's approach to page generation.",
      ] },
  ];
  const DIAGRAM_LABELS = {
    paladin: 'diagram: an eight-hour manual workflow against a 28-second python run, then 250+ sites on a city map',
    sailbot: 'diagram: a team of seven, a shared application flowing into team review boards, then about 200 ships drifting',
    shopify: 'diagram: a business description turning into a storefront on a phone, skia loaders, then a reliability checklist',
    superpilot: 'diagram: a research, build, review agent loop, then cost and runtime bars shrinking, then a side-by-side evaluation',
  };

  // ================= timing / look =================
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const OPEN_MS = 900, CLOSE_MS = 420, FADE_MS = 220;
  const BOIL_MS = 125;
  const WOBBLE_AMP = 4, WOBBLE_FINE = 1.375;
  const CYCLE_MS = 5000;   // each bullet holds the diagram this long before the next
  const STEP_PX = 60;      // wheel travel that moves one stop
  const MAP_DRAFT_MS = 1400;
  const MEDIA_DELAY_MS = 700;
  const INK = '#ffffff';
  const PAPER = '#0041ba';
  const FONT = '"Alte Haas Grotesk", "Helvetica Neue", Arial, sans-serif';
  const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

  // ================= helpers =================
  const fract = (x) => x - Math.floor(x);
  function hash(x, y) { x = fract(x * 123.34); y = fract(y * 345.45); const d = x * (x + 34.345) + y * (y + 34.345); return fract((x + d) * (y + d)); }
  function noise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = hash(ix, iy) + (hash(ix + 1, iy) - hash(ix, iy)) * ux;
    const b = hash(ix, iy + 1) + (hash(ix + 1, iy + 1) - hash(ix, iy + 1)) * ux;
    return a + (b - a) * uy;
  }
  const clamp01 = (v) => Math.min(1, Math.max(0, v));
  const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const lerp = (a, b, t) => a + (b - a) * t;
  function rng(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

  function resample(pts, step) {
    const out = []; let acc = 0;
    for (let i = 0; i < pts.length - 1; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[i + 1];
      const len = Math.hypot(bx - ax, by - ay) || 1e-6;
      const nx = -(by - ay) / len, ny = (bx - ax) / len;
      const n = Math.max(1, Math.ceil(len / step));
      for (let k = i === 0 ? 0 : 1; k <= n; k++) { const t = k / n; out.push({ x: ax + (bx - ax) * t, y: ay + (by - ay) * t, nx, ny, s: acc + len * t }); }
      acc += len;
    }
    return { samples: out, len: acc };
  }
  function pathLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
  function pointAt(pts, d) {
    let acc = 0;
    for (let i = 1; i < pts.length; i++) {
      const L = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      if (acc + L >= d || i === pts.length - 1) {
        const t = L ? clamp01((d - acc) / L) : 0;
        return { x: lerp(pts[i - 1][0], pts[i][0], t), y: lerp(pts[i - 1][1], pts[i][1], t), ang: Math.atan2(pts[i][1] - pts[i - 1][1], pts[i][0] - pts[i - 1][0]) };
      }
      acc += L;
    }
    return { x: pts[0][0], y: pts[0][1], ang: 0 };
  }
  // A pencil polyline: jittered along its normal by noise, drawn up to `prog`.
  function sketch(ctx, pts, prog, seed, amp, fine, width, alpha, step = 5) {
    if (prog <= 0 || alpha <= 0.002 || pts.length < 2) return;
    const { samples, len } = resample(pts, step);
    const stop = len * Math.min(prog, 1);
    const off = (p) => (noise(p.s * 0.045 + seed * 17.31, seed * 9.13) - 0.5) * amp + (noise(p.s * 0.17 + seed * 29.7, seed * 3.1 + 7.7) - 0.5) * fine;
    ctx.beginPath();
    let prev = null;
    for (const p of samples) {
      let q = p;
      if (p.s > stop) { if (!prev) break; const t = (stop - prev.s) / (p.s - prev.s || 1); q = { x: lerp(prev.x, p.x, t), y: lerp(prev.y, p.y, t), nx: p.nx, ny: p.ny, s: stop }; }
      const d = off(q); const x = q.x + q.nx * d, y = q.y + q.ny * d;
      if (!prev) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      prev = p;
      if (p.s > stop) break;
    }
    ctx.lineWidth = width; ctx.globalAlpha = alpha; ctx.stroke();
  }

  // ---- crumple (ported from src/components/story/crumple.ts) ----
  function roundRectLoop(w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2)); const pts = [];
    const line = (ax, ay, bx, by) => { const n = Math.max(1, Math.round(Math.hypot(bx - ax, by - ay) / 3)); for (let i = 0; i < n; i++) pts.push([ax + ((bx - ax) * i) / n, ay + ((by - ay) * i) / n]); };
    const arc = (cx, cy, a0) => { for (let i = 0; i < 6; i++) { const a = a0 + (i / 6) * (Math.PI / 2); pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr]); } };
    line(rr, 0, w - rr, 0); arc(w - rr, rr, -Math.PI / 2); line(w, rr, w, h - rr); arc(w - rr, h - rr, 0);
    line(w - rr, h, rr, h); arc(rr, h - rr, Math.PI / 2); line(0, h - rr, 0, rr); arc(rr, rr, Math.PI);
    return pts;
  }
  function newCrumple() {
    const r = Math.random, edge = () => (r() < 0.5 ? 0 : 1);
    return { jag: Array.from({ length: 9 }, () => r() * 2 - 1), lag: Array.from({ length: 6 }, () => r()),
      rot: (r() < 0.5 ? -1 : 1) * (8 + r() * 8), creases: Array.from({ length: 5 }, () => [r(), edge(), r(), 1 - edge()]) };
  }
  const unfold = (p) => ease(clamp01(p));
  const facet = (v, u) => { const n = v.length, x = u * n, i = Math.floor(x) % n, f = x - Math.floor(x); return v[i] + (v[(i + 1) % n] - v[i]) * f; };
  const smoothv = (v, u) => { const n = v.length, x = u * n, i = Math.floor(x) % n, f = x - Math.floor(x); return v[i] + (v[(i + 1) % n] - v[i]) * f * f * (3 - 2 * f); };
  function crumpleLoop(base, c, e, w, h) {
    const loose = 1 - clamp01(e); if (loose === 0) return base.slice();
    const cx = w / 2, cy = h / 2, n = base.length;
    return base.map(([x, y], k) => {
      const a = base[(k - 2 + n) % n], b = base[(k + 2) % n];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const nx = (b[1] - a[1]) / len, ny = -(b[0] - a[0]) / len;
      const u = (Math.atan2((y - cy) / h, (x - cx) / w) + Math.PI) / (2 * Math.PI);
      const pull = 0.7 * Math.pow(loose, 1.1) * smoothv(c.lag, u);
      const jag = 0.34 * h * Math.pow(loose, 1.4) * facet(c.jag, u);
      return [cx + (x - cx) * (1 - pull) + nx * jag, cy + (y - cy) * (1 - pull) + ny * jag];
    });
  }
  function wobbleLoop(loop, seed, amp, fineAmp) {
    const n = loop.length, sx = seed * 17.31, sy = seed * 9.13;
    return loop.map(([x, y], k) => {
      const a = loop[(k - 2 + n) % n], b = loop[(k + 2) % n];
      const len = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1;
      const tx = (b[0] - a[0]) / len, ty = (b[1] - a[1]) / len;
      const d = (noise(x * 0.07 + sx, y * 0.07 + sy) - 0.5) * amp + (noise(x * 0.21 + sx * 1.7, y * 0.21 + sy * 1.7) - 0.5) * fineAmp;
      return [x - ty * d, y + tx * d];
    });
  }

  // ================= DOM =================
  const stage = document.getElementById('stage');
  const mapC = document.getElementById('map'), mctx = mapC.getContext('2d');
  const hitsEl = document.getElementById('hits');
  const frameEl = document.getElementById('frame'), clipEl = document.getElementById('clip');
  const outlineC = document.getElementById('outline'), octx = outlineC.getContext('2d');
  const diagC = document.getElementById('diagram'), dctx = diagC.getContext('2d');
  const creasesEl = document.getElementById('creases');
  const panel = document.getElementById('panel'), card = document.getElementById('card'), bulletsEl = document.getElementById('bullets');
  const stopEl = document.getElementById('stop'), signTitle = document.getElementById('sign-title'), signSub = document.getElementById('sign-sub');
  const hint = document.getElementById('hint');

  document.documentElement.style.setProperty('--cycle', `${CYCLE_MS}ms`);

  const hits = JOBS.map((job, j) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'hit';
    b.setAttribute('aria-label', `go to ${job.company}`);
    b.addEventListener('click', () => { setJob(j); everStepped = true; });
    hitsEl.append(b); return b;
  });

  // ================= stops =================
  // One job on screen at a time. The card shows all of its bullets at full
  // strength; the diagram shows one bullet's state, picked by hover/focus or
  // a slow cycle.
  let activeJob = -1, activeBullet = 0, bulletEls = [], held = false, bulletSince = 0, everStepped = false;
  let swapTimer = 0;

  function renderCard(j) {
    const job = JOBS[j];
    held = false;
    stopEl.textContent = `stop ${j + 1} of ${JOBS.length}`;
    signTitle.textContent = job.company;
    signSub.textContent = `${job.title} · ${job.years}`;
    bulletsEl.innerHTML = '';
    bulletEls = job.chunks.map((text, i) => {
      const li = document.createElement('li'); li.tabIndex = 0;
      const n = document.createElement('span'); n.className = 'n'; n.setAttribute('aria-hidden', 'true'); n.textContent = String(i + 1);
      const tx = document.createElement('span'); tx.textContent = text;
      const bar = document.createElement('span'); bar.className = 'bar'; bar.setAttribute('aria-hidden', 'true');
      li.append(n, tx, bar);
      const hold = () => { held = true; setBullet(i); };
      const release = () => { held = false; setBullet(activeBullet); };
      li.addEventListener('pointerenter', hold); li.addEventListener('pointerleave', release);
      li.addEventListener('focus', hold); li.addEventListener('blur', release);
      bulletsEl.append(li); return li;
    });
    setBullet(0);
  }
  function setBullet(i) {
    activeBullet = i; bulletSince = performance.now();
    bulletEls.forEach((li, k) => {
      li.classList.toggle('on', k === i); li.classList.toggle('held', held); li.classList.toggle('still', reduced);
      if (k === i) { const bar = li.querySelector('.bar'); bar.style.animation = 'none'; void bar.offsetWidth; bar.style.animation = ''; }
    });
  }
  function setJob(j, instant = false) {
    j = Math.min(JOBS.length - 1, Math.max(0, j));
    if (j === activeJob && !instant) return;
    activeJob = j; activeBullet = 0; bulletSince = performance.now();
    clearTimeout(swapTimer);
    if (instant) { renderCard(j); card.classList.remove('swap'); return; }
    card.classList.add('swap');
    swapTimer = setTimeout(() => { renderCard(j); card.classList.remove('swap'); }, 160);
  }
  function step(d) { const j = activeJob + d; if (j >= 0 && j < JOBS.length) { setJob(j); everStepped = true; } }
  function autoCycle(now) {
    if (reduced || held || activeJob < 0 || !bulletEls.length) return;
    if (now - bulletSince > CYCLE_MS) setBullet((activeBullet + 1) % bulletEls.length);
  }

  // One gesture, one stop: after a step, the wheel stays locked until the
  // gesture (and a trackpad's momentum) has gone quiet.
  let wheelAcc = 0, lastWheel = 0, lockedAt = 0, locked = false;
  window.addEventListener('wheel', (e) => {
    e.preventDefault();
    const now = performance.now();
    if (locked) {
      if (now - lastWheel > 180 && now - lockedAt > 450) locked = false;
      else { lastWheel = now; return; }
    }
    if (now - lastWheel > 300) wheelAcc = 0;
    lastWheel = now;
    wheelAcc += e.deltaMode === 1 ? e.deltaY * 16 : e.deltaMode === 2 ? e.deltaY * innerHeight : e.deltaY;
    if (Math.abs(wheelAcc) >= STEP_PX) { step(Math.sign(wheelAcc)); wheelAcc = 0; locked = true; lockedAt = now; }
  }, { passive: false });
  let touchY = null;
  window.addEventListener('touchstart', (e) => { touchY = e.touches[0].clientY; }, { passive: true });
  window.addEventListener('touchend', (e) => {
    if (touchY === null) return;
    const dy = touchY - e.changedTouches[0].clientY; touchY = null;
    if (Math.abs(dy) > 50) step(Math.sign(dy));
  }, { passive: true });
  window.addEventListener('keydown', (e) => {
    if (['ArrowDown', 'ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && !e.shiftKey)) { e.preventDefault(); step(1); }
    if (['ArrowUp', 'ArrowLeft', 'PageUp'].includes(e.key) || (e.key === ' ' && e.shiftKey)) { e.preventDefault(); step(-1); }
    if (e.key === 'Home') { setJob(0); everStepped = true; }
    if (e.key === 'End') { setJob(JOBS.length - 1); everStepped = true; }
  });

  // ================= layout =================
  let W = 0, H = 0, dpr = 1;
  let M = null;        // map geometry
  let F = { x: 0, y: 0, w: 0, h: 0, pad: 0 };
  const DW = 480, DH = 300;

  function layout() {

          if (tick >= 1) T('fixed', 440, y + 2, { mono: 1, size: 10, align: 'right', a: 0.75 });
        });
      },
    ],
    superpilot: [
      (t) => {
        const nodes = [['research', 128, 66], ['build', 206, 210], ['review', 50, 210]];
        nodes.forEach(([n, x, y], i) => { C(x, y, 32, { k: i }); T(n, x, y + 4, { mono: 1, size: 10, align: 'center' }); });
        const edge = (a, b, k) => { const [, x1, y1] = nodes[a], [, x2, y2] = nodes[b]; const d = Math.hypot(x2 - x1, y2 - y1); const ux = (x2 - x1) / d, uy = (y2 - y1) / d; arrow(x1 + ux * 38, y1 + uy * 38, x2 - ux * 38, y2 - uy * 38, { k, a: 0.7 }); };
        edge(0, 1, 5); edge(1, 2, 6); edge(2, 0, 7);
        const ph = (t % 3600) / 3600; const seg = Math.floor(ph * 3), f = ph * 3 - seg;
        const [, ax, ay] = nodes[seg], [, bx, by] = nodes[(seg + 1) % 3];
        dot(lerp(ax, bx, f), lerp(ay, by, f), 4.5);
        R(266, 34, 186, 124, { k: 10 }); L([[266, 48], [452, 48]], { k: 11, a: 0.6 });
        phone(392, 138, 70, 146, 12);
        const built = ph > 1 / 3 || t > 3600;
        if (built) {
          R(278, 58, 160, 12, { k: 20, amp: 1 }); R(278, 78, 94, 66, { k: 21, amp: 1 }); hatch(278, 78, 94, 66, 6, 0.55);
          [84, 98, 112].forEach((y, i) => L([[382, y], [382 + [52, 40, 46][i], y]], { k: 22 + i, a: 0.6, amp: 0.6 }));
          R(400, 160, 54, 10, { k: 30, amp: 1 }); R(400, 176, 54, 40, { k: 31, amp: 1 }); hatch(400, 176, 54, 40, 6, 0.55);
        }
        if (ph > 2 / 3 || t > 3600) {
          L([[440, 22], [446, 28], [458, 14]], { k: 40, w: 2, amp: 0.6 });
          L([[440, 128], [446, 134], [458, 120]], { k: 41, w: 2, amp: 0.6 });
        }
        T('desktop + mobile', 300, 180, { mono: 1, size: 10, a: 0.7 });
      },
      (t) => {
        [['cost', 108, 0.55, '−55%'], ['runtime', 198, 0.5, '≈ ½']].forEach(([label, y, cut, tag], i) => {
          T(label, 24, y + 4, { mono: 1, size: 12 });
          R(104, y - 18, 300, 36, { k: i, a: 0.35 });
          const p = ease(clamp01((t - 300 - i * 200) / 1200));
          const w = 300 * (1 - cut * p);
          hatch(104, y - 18, w, 36, 5, 0.85);
          R(104, y - 18, w, 36, { k: 5 + i, amp: 1 });
          T(tag, 416, y + 7, { size: 20, bold: 1, a: p });
        });
        T('prompts · caching · model choice', 104, 268, { mono: 1, size: 10, a: 0.75 });
      },
      (t) => {
        [['existing', 54], ['prototype', 280]].forEach(([name, x], i) => {
          R(x, 30, 150, 108, { k: i });
          R(x + 12, 44, 126, 10, { k: 4 + i, a: 0.7, amp: 0.8 }); R(x + 12, 62, 70, 62, { k: 6 + i, a: 0.7, amp: 0.8 }); hatch(x + 12, 62, 70, 62, 7, 0.4);
          T(name, x + 75, 156, { mono: 1, size: 11, align: 'center' });
        });
        T('vs', 242, 92, { size: 16, bold: 1, align: 'center' });
        ['quality', 'cost', 'speed'].forEach((c, i) => {
          const y = 196 + i * 30;
          T(c, 24, y + 4, { mono: 1, size: 11, a: 0.8 });
          L([[100, y + 12], [456, y + 12]], { k: 20 + i, a: 0.2, amp: 0.6 });
          [129, 355].forEach((cx, j) => { const a = clamp01((t - 300 - (i * 2 + j) * 220) / 250); if (a > 0) C(cx, y, 6, { k: 30 + i * 2 + j, a }); });
        });
      },
    ],
  };

  // ================= media sequencing =================
  let baseLoop = [];
  let seq = { shown: -1, progress: 0, crumple: newCrumple() };
  let dState = { cur: 0, prev: -1, changedAt: 0, prevAt: 0, job: -1 };
  let jobShownAt = 0;

  function renderCreases(c) {
    creasesEl.innerHTML = c.creases.map(([x1, y1, x2, y2]) =>
      `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="rgba(0,25,80,0.55)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>` +
      `<line x1="${x1 + 0.003}" y1="${y1}" x2="${x2 + 0.003}" y2="${y2}" stroke="rgba(255,255,255,0.55)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
  }
  renderCreases(seq.crumple);

  function stepMedia(now, dt) {
    const want = now - arriveAt < MEDIA_DELAY_MS ? -1 : activeJob;
    if (seq.shown !== want) {
      if (seq.shown === -1 || seq.progress <= 0) {
        seq.shown = want; seq.progress = 0; seq.crumple = newCrumple(); renderCreases(seq.crumple);
        if (want >= 0) { clipEl.setAttribute('aria-label', DIAGRAM_LABELS[JOBS[want].key]); jobShownAt = now; dState = { cur: activeBullet, prev: -1, changedAt: now, prevAt: now, job: want }; }
      } else seq.progress = Math.max(0, seq.progress - dt / (reduced ? FADE_MS : CLOSE_MS));
    } else if (seq.shown >= 0) seq.progress = Math.min(1, seq.progress + dt / (reduced ? FADE_MS : OPEN_MS));

    // Within a job, a new bullet morphs the diagram in place.
    if (seq.shown >= 0 && seq.shown === activeJob) {
      const local = activeBullet;
      if (local !== dState.cur) { dState.prev = dState.cur; dState.prevAt = dState.changedAt; dState.cur = local; dState.changedAt = now; }
    }
  }

  function drawFrame(now, boil) {
    if (seq.shown < 0) { frameEl.style.visibility = 'hidden'; return; }
    frameEl.style.visibility = 'visible';
    const e = reduced ? 1 : unfold(seq.progress);
    const c = seq.crumple;
    const loop = wobbleLoop(crumpleLoop(baseLoop, c, e, F.w, F.h), boil, WOBBLE_AMP, WOBBLE_FINE);
    const rot = reduced ? 0 : c.rot * (1 - e), sc = reduced ? 1 : 0.14 + 0.86 * e;
    frameEl.style.transform = `rotate(${rot}deg) scale(${sc})`;
    frameEl.style.opacity = reduced ? String(seq.progress) : '1';
    clipEl.style.clipPath = `path("M${loop.map(([x, y]) => `${x.toFixed(1)} ${y.toFixed(1)}`).join('L')}Z")`;
    creasesEl.style.opacity = String(reduced ? 0 : Math.pow(1 - e, 1.1));

    octx.setTransform(dpr, 0, 0, dpr, F.pad * dpr, F.pad * dpr);
    octx.clearRect(-F.pad, -F.pad, F.w + 2 * F.pad, F.h + 2 * F.pad);
    octx.strokeStyle = INK; octx.lineJoin = 'round';
    octx.beginPath(); loop.forEach(([x, y], i) => (i ? octx.lineTo(x, y) : octx.moveTo(x, y))); octx.closePath();
    octx.globalAlpha = 1; octx.lineWidth = 1.4 / sc; octx.stroke();

    // Diagram
    const key = JOBS[seq.shown].key;
    const states = DIAGRAMS[key];
    dctx.setTransform((F.w / DW) * dpr, 0, 0, (F.h / DH) * dpr, 0, 0);
    dctx.clearRect(0, 0, DW, DH);
    dctx.strokeStyle = INK; dctx.fillStyle = INK; dctx.lineCap = 'round'; dctx.lineJoin = 'round';
    SEED = boil;
    const x = reduced ? 1 : clamp01((now - dState.changedAt) / 280);
    const tt = (at) => (reduced ? 6000 : now - at);
    if (dState.prev >= 0 && x < 1) { A = 1 - x; states[dState.prev](tt(dState.prevAt)); }
    A = dState.prev >= 0 ? x : 1;
    states[dState.cur](tt(dState.changedAt));
    A = 1;
  }

  // ================= main loop =================
  let then = performance.now();
  function tick(now) {
    const dt = Math.min(64, now - then); then = now;
    const boil = reduced ? 0 : Math.floor(now / BOIL_MS) % 997;

    hint.style.opacity = everStepped ? '0' : '1';
    autoCycle(now);

    if (M) {
      const target = M.stationDist[activeJob];
      trainDist += (target - trainDist) * Math.min(1, dt / (reduced ? 1 : 260));
      if (Math.abs(target - trainDist) < 0.5) trainDist = target;
    }
    drawMap(now, boil);
    stepMedia(now, dt);
    drawFrame(now, boil);
    requestAnimationFrame(tick);
  }

  document.getElementById('replay').addEventListener('click', () => {
    arriveAt = performance.now(); everStepped = false; setJob(0, true);
    seq = { shown: -1, progress: 0, crumple: newCrumple() }; trainDist = 0;
  });

  new ResizeObserver(() => layout()).observe(stage);
  layout();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
  setJob(0, true);
  trainDist = M ? M.stationDist[0] : 0;
  requestAnimationFrame((t) => { then = t; tick(t); });
})();
